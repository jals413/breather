name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: Mac app — build & test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: swift test
      - name: Build (universal, ad hoc)
        run: UNIVERSAL=1 SIGN_IDENTITY=- scripts/build.sh

  mobile:
    name: iPhone & Watch — build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build free configuration
        run: >
          xcodebuild -project BreatherMobile.xcodeproj -scheme BreatherPhone -configuration Debug
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build paid configuration
        run: >
          xcodebuild -project BreatherMobile.xcodeproj -scheme "BreatherPhone (Paid)" -configuration DebugPaid
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
